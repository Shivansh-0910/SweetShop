spring:
  application:
    name: sweet-shop
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sweetsdb}
    username: ${DB_USER:sweet}
    password: ${DB_PASS:sweetpass}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:change_this_in_production_use_a_long_secure_random_string}
  expiration-ms: 3600000  # 1 hour in milliseconds

logging:
  level:
    com.incubyte.sweet: DEBUG
    org.springframework.security: DEBUG
