version: '3.8'

services:
  db:
    image: postgres:15
    container_name: sweetshop-postgres
    environment:
      POSTGRES_USER: sweet
      POSTGRES_PASSWORD: sweetpass
      POSTGRES_DB: sweetsdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweet -d sweetsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
